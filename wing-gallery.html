<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wing Gallery · Sunrise Hostels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600;700&family=Mukta:wght@500;600;700&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600;700&family=Mukta:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600;700&family=Mukta:wght@500;600;700&display=swap" rel="stylesheet" /></noscript>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#0d1b2a" />
  <link rel="stylesheet" href="assets/css/style.min.css" />
  <style>
    /* Premium custom styles for the Wing Gallery page */
    .g-header {
      background: var(--d-surface);
      border-bottom: 1px solid var(--line);
      padding: 24px 0;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .g-header__in {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .g-header__title {
      font-family: var(--d-head);
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: var(--d-primary);
    }
    .g-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--d-primary);
      transition: transform 0.2s ease;
    }
    .g-back-btn:hover {
      transform: translateX(-4px);
    }

    /* Hero Building display */
    .g-hero {
      position: relative;
      height: 420px;
      border-radius: calc(var(--d-radius) * 1.5px);
      overflow: hidden;
      margin-top: 40px;
      margin-bottom: 60px;
      display: flex;
      align-items: flex-end;
      color: #fff;
      box-shadow: 0 20px 50px rgba(13, 27, 42, 0.15);
    }
    .g-hero__img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }
    .g-hero:hover .g-hero__img {
      transform: scale(1.03);
    }
    .g-hero__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(13, 27, 42, 0.85) 0%, rgba(13, 27, 42, 0.2) 60%, transparent 100%);
      z-index: 1;
    }
    .g-hero__content {
      position: relative;
      z-index: 2;
      padding: 40px;
      width: 100%;
    }
    .g-hero__subtitle {
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--d-accent);
      margin-bottom: 8px;
      font-weight: 700;
    }
    .g-hero__title {
      font-family: var(--d-head);
      font-size: clamp(2rem, 5vw, 3.2rem);
      margin-bottom: 12px;
      line-height: 1.1;
    }
    .g-hero__meta {
      opacity: 0.9;
      font-size: 1.05rem;
      max-width: 600px;
    }

    /* Grid layout */
    .g-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 80px;
    }
    .g-tile {
      position: relative;
      border-radius: calc(var(--d-radius) * 1px);
      overflow: hidden;
      aspect-ratio: 4/3;
      background: var(--soft);
      cursor: pointer;
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.3s ease;
    }
    .g-tile:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(13, 27, 42, 0.12);
    }
    .g-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .g-tile:hover img {
      transform: scale(1.05);
    }
    .g-tile__label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(to top, rgba(13, 27, 42, 0.8) 0%, transparent 100%);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .g-tile:hover .g-tile__label {
      opacity: 1;
    }

    /* Lightbox Modal */
    .g-lightbox {
      position: fixed;
      inset: 0;
      background: rgba(13, 27, 42, 0.98);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .g-lightbox.open {
      opacity: 1;
      pointer-events: auto;
    }
    .g-lightbox__close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: none;
      border: none;
      color: #fff;
      font-size: 2.2rem;
      cursor: pointer;
      line-height: 1;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }
    .g-lightbox__close:hover {
      transform: rotate(90deg);
    }
    .g-lightbox__img-wrap {
      max-width: 90vw;
      max-height: 75vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .g-lightbox__img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .g-lightbox__btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .g-lightbox__btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-50%) scale(1.05);
    }
    .g-lightbox__btn--prev { left: -70px; }
    .g-lightbox__btn--next { right: -70px; }
    @media (max-width: 768px) {
      .g-lightbox__btn {
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
      }
      .g-lightbox__btn--prev { left: 10px; }
      .g-lightbox__btn--next { right: 10px; }
      .g-lightbox__img-wrap {
        max-width: 96vw;
      }
    }
    .g-lightbox__counter {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
      margin-top: 24px;
      font-family: var(--d-body);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="g-header">
    <div class="d-wrap g-header__in">
      <a href="index.html#wings" class="g-back-btn">
        ← Back to Home
      </a>
      <h1 class="g-header__title" id="wing-title">Wing Gallery</h1>
      <span class="d-nav__mark">S</span>
    </div>
  </header>

  <!-- Gallery Content -->
  <main class="d-wrap">
    <!-- Hero Building section -->
    <div class="g-hero" id="gallery-hero">
      <img id="hero-img" class="g-hero__img" src="" alt="Building Exterior" />
      <div class="g-hero__overlay"></div>
      <div class="g-hero__content">
        <span class="g-hero__subtitle" id="wing-subtitle">Sunrise Hostels</span>
        <h2 class="g-hero__title" id="wing-hero-title">Hostel Wing</h2>
        <p class="g-hero__meta" id="wing-description">Homely, secure and comfortable stay for aspirants.</p>
      </div>
    </div>

    <!-- Section Title -->
    <div style="margin-bottom: 30px">
      <span class="d-kicker">Photo Gallery</span>
      <h2 class="d-h2">Explore the Facilities</h2>
    </div>

    <!-- Dynamic Image Grid -->
    <div class="g-grid" id="image-grid">
      <!-- Generated dynamically -->
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div class="g-lightbox" id="lightbox">
    <button class="g-lightbox__close" id="lightbox-close">×</button>
    <div class="g-lightbox__img-wrap">
      <button class="g-lightbox__btn g-lightbox__btn--prev" id="lightbox-prev">‹</button>
      <img class="g-lightbox__img" id="lightbox-img" src="" alt="" />
      <button class="g-lightbox__btn g-lightbox__btn--next" id="lightbox-next">›</button>
    </div>
    <div class="g-lightbox__counter" id="lightbox-counter">1 / 1</div>
  </div>

  <!-- Dynamic Gallery Controller Script -->
  <script>
    (function () {
      "use strict";

      // Configuration of wing data
      const WING_DATA = {
        'girls-a': {
          title: "Girls · Wing A",
          subtitle: "Largest Girls Wing · 92 Beds",
          desc: "Featuring 92 beds across 4 spacious floors, Wing A offers a secure, study-focused environment in front of Gurukripa Coaching with maximum privacy and all key comforts.",
          folder: "images/Girls/Wing A",
          count: 22,
          building: "images/SPECIAL/Building Exterior_G_A.webp"
        },
        'girls-b': {
          title: "Girls · Wing B",
          subtitle: "Quiet Girls Wing · 70 Beds",
          desc: "With 70 beds spread over 4 floors, Wing B provides a peaceful and highly homely atmosphere ideal for focused revision and preparation.",
          folder: "images/Girls/Wing B",
          count: 19,
          building: "images/SPECIAL/Building Exterior_G_B.webp"
        },
        'boys-a': {
          title: "Boys · Wing A",
          subtitle: "Premium Boys Wing · 100 Beds",
          desc: "Our largest boys wing features 100 premium beds across 4 floors. Spaciously designed with high ventilation, excellent security, and dedicated study desks.",
          folder: "images/boys/Wing A",
          count: 25,
          building: "images/SPECIAL/Building Exterior_B_A.webp"
        },
        'boys-b': {
          title: "Boys · Wing B",
          subtitle: "Compact Boys Wing · 44 Beds",
          desc: "A cozy and calm boys wing with 44 beds across 2 floors, designed specifically for students who perform best in smaller, close-knit communities.",
          folder: "images/boys/Wing B",
          count: 7,
          building: "images/SPECIAL/Building Exterior_B_B.webp"
        }
      };

      // Get wing query parameter
      const params = new URLSearchParams(window.location.search);
      const wingId = params.get('wing') || 'girls-a';
      const wing = WING_DATA[wingId] || WING_DATA['girls-a'];

      // Set page details
      document.title = `${wing.title} Gallery · Sunrise Hostels`;
      document.getElementById('wing-title').textContent = wing.title;
      document.getElementById('wing-hero-title').textContent = wing.title;
      document.getElementById('wing-subtitle').textContent = wing.subtitle;
      document.getElementById('wing-description').textContent = wing.desc;
      document.getElementById('hero-img').src = wing.building;

      // Prepare images list
      const images = [wing.building];
      for (let i = 1; i <= wing.count; i++) {
        images.push(`${wing.folder}/${i}.webp`);
      }

      // Populate Image Grid
      const grid = document.getElementById('image-grid');
      images.forEach((src, idx) => {
        const tile = document.createElement('div');
        tile.className = 'g-tile';
        
        let label = "Room / Facility";
        if (idx === 0) label = "Building Exterior";
        else if (idx === 1) label = "Lobby & Reception";
        else if (idx <= 5) label = "Resident Rooms";
        else label = `Facility View #${idx}`;

        tile.innerHTML = `
          <img src="${src}" alt="${label}" loading="lazy" />
          <div class="g-tile__label">${label}</div>
        `;
        tile.addEventListener('click', () => openLightbox(idx));
        grid.appendChild(tile);
      });

      // Lightbox Logic
      let currentIdx = 0;
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxClose = document.getElementById('lightbox-close');
      const lightboxPrev = document.getElementById('lightbox-prev');
      const lightboxNext = document.getElementById('lightbox-next');
      const lightboxCounter = document.getElementById('lightbox-counter');

      function openLightbox(idx) {
        currentIdx = idx;
        updateLightbox();
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
      }

      function nextImg(e) {
        if (e) e.stopPropagation();
        currentIdx = (currentIdx + 1) % images.length;
        updateLightbox();
      }

      function prevImg(e) {
        if (e) e.stopPropagation();
        currentIdx = (currentIdx - 1 + images.length) % images.length;
        updateLightbox();
      }

      function updateLightbox() {
        lightboxImg.src = images[currentIdx];
        lightboxCounter.textContent = `${currentIdx + 1} / ${images.length}`;
      }

      lightboxClose.addEventListener('click', closeLightbox);
      lightboxNext.addEventListener('click', nextImg);
      lightboxPrev.addEventListener('click', prevImg);
      lightbox.addEventListener('click', closeLightbox);
      lightboxImg.addEventListener('click', (e) => e.stopPropagation());

      // Keyboard support
      document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') nextImg();
        if (e.key === 'ArrowLeft') prevImg();
      });

    })();
  </script>
  <script src="assets/js/premium.min.js" defer></script>
</body>
</html>
